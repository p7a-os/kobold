name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kobold-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: kobold-darwin-aarch64.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev pkg-config

      - name: Build release binaries
        env:
          RUSTFLAGS: ""
        run: cargo build --release

      - name: Package release archive
        run: |
          cd target/release
          tar -czvf "../../${{ matrix.artifact_name }}" \
            kobold \
            koboldd \
            kobold-adapter-acp \
            kobold-adapter-tmux \
            kobold-openai \
            kobold-tts

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_name }}

[package]
name = "kobold-adapter-acp"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Dario Farzati"]
rust-version = "1.93"
description = "Agent Client Protocol (ACP) adapter for Kobold"
repository = "https://github.com/p7a-os/kobold"
homepage = "https://github.com/p7a-os/kobold"

[dependencies]
kobold-proto = { path = "../kobold-proto" }
kobold-core = { path = "../kobold-core" }
tokio = { version = "1", default-features = false, features = ["rt", "process", "io-util", "io-std", "sync", "macros", "time"] }
sonic-rs = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[lib]
name = "kobold_adapter_acp"
path = "src/lib.rs"

[[bin]]
name = "kobold-adapter-acp"
path = "src/main.rs"

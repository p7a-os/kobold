[package]
name = "kobold-adapter-tmux"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Dario Farzati"]
rust-version = "1.93"
description = "Persistent tmux/PTY harness adapter for Kobold"
repository = "https://github.com/p7a-os/kobold"
homepage = "https://github.com/p7a-os/kobold"

[dependencies]
kobold-proto = { path = "../kobold-proto" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "io-util", "io-std", "time", "process", "sync", "macros", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
libc = "0.2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

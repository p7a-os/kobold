[package]
name = "kobold-context"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Conversation history, token budgeting, prompt construction, and two-tier compaction for Kobold thin harness"

[dependencies]
kobold-types = { path = "../kobold-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[package]
name = "kobold-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "In-process agent session runtime, transcript persistence, and workspace supervisor SDK for Kobold"

[dependencies]
kobold-types = { path = "../kobold-types" }
kobold-context = { path = "../kobold-context" }
kobold-kernel = { path = "../kobold-kernel" }
kobold-tool-fs = { path = "../kobold-tool-fs" }
kobold-tool-bash = { path = "../kobold-tool-bash" }
kobold-backend-openai = { path = "../kobold-backend-openai" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "kobold-backend-openai"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "OpenAI Realtime Responses WebSocket streaming backend for Kobold harness"

[dependencies]
kobold-types = { path = "../kobold-types" }
async-trait = "0.1"
bytes = "1"
fastwebsockets = { version = "0.10", features = ["upgrade"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1.11", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

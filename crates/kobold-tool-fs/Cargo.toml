[package]
name = "kobold-tool-fs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Structured filesystem tools (read, write, edit, list) for Kobold harness"

[dependencies]
kobold-types = { path = "../kobold-types" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
